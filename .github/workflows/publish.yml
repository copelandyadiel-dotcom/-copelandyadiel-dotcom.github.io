name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Unpack website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          for archive in irina-sidorova-github-pages.zip irina-sidorova-media-02.zip irina-sidorova-media-03.zip; do
            test -f "$archive" || { echo "Missing archive: $archive"; exit 1; }
            unzip -q -o "$archive" -d site
          done
          test -s site/index.html
          test -f site/.nojekyll
          test "$(find site/assets/portfolio/videos -name '*.mp4' | wc -l)" -eq 9

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
